
name: Update AniList Discord Embed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: anilist-discord-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check environment
        env:
          ANILIST_USERNAME: ${{ vars.ANILIST_USERNAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ vars.DISCORD_MESSAGE_ID }}
        run: |
          echo "Starting diagnostic..."
          echo "Username: ${ANILIST_USERNAME}"
          echo "Message ID is set: $([ -n "$DISCORD_MESSAGE_ID" ] && echo yes || echo no)"
          echo "Webhook secret is set: $([ -n "$DISCORD_WEBHOOK_URL" ] && echo yes || echo no)"
          echo "Python version:"
          python --version
          echo "update.py exists:"
          ls -l update.py

      - name: Run update.py
        env:
          ANILIST_USERNAME: ${{ vars.ANILIST_USERNAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ vars.DISCORD_MESSAGE_ID }}
        run: |
          echo "Launching update.py..."
          python -u update.py
          echo "update.py finished."

