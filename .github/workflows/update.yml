
name: Update AniList Discord Embed

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: anilist-discord-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Restore message IDs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import io
          import os
          import zipfile
          import requests

          repository = os.environ["GH_REPOSITORY"]
          current_run = int(os.environ["GH_RUN_ID"])
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          api = f"https://api.github.com/repos/{repository}"

          response = requests.get(
              f"{api}/actions/artifacts?per_page=100",
              headers=headers,
              timeout=30,
          )
          response.raise_for_status()

          artifacts = [
              artifact
              for artifact in response.json().get("artifacts", [])
              if artifact["name"] == "discord-message-ids"
              and not artifact["expired"]
              and artifact.get("workflow_run", {}).get("id") != current_run
          ]

          if not artifacts:
              print("No previous message-ID artifact found; starting fresh.")
          else:
              artifact = max(
                  artifacts,
                  key=lambda item: item["created_at"],
              )

              print(
                  f"Restoring message IDs from artifact {artifact['id']}"
              )

              download = requests.get(
                  f"{api}/actions/artifacts/{artifact['id']}/zip",
                  headers=headers,
                  timeout=60,
              )
              download.raise_for_status()

              with zipfile.ZipFile(
                  io.BytesIO(download.content)
              ) as archive:
                  try:
                      content = archive.read(
                          "discord_message_ids.json"
                      )
                  except KeyError:
                      print(
                          "Message-ID file not found; starting fresh."
                      )
                  else:
                      with open(
                          "discord_message_ids.json", "wb"
                      ) as output:
                          output.write(content)

                      print("Message IDs restored successfully.")
          PY

      - name: Run update.py
        env:
          ANILIST_USERNAME: ${{ vars.ANILIST_USERNAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISPLAY_TIMEZONE: Pacific/Honolulu
        run: |
          echo "Started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python -u update.py
          echo "Finished at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Upload message IDs
        if: success() && hashFiles('discord_message_ids.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: discord-message-ids
          path: discord_message_ids.json
          retention-days: 90
          overwrite: true
