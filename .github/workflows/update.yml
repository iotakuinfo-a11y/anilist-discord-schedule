name: Update AniList Discord Embed

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: anilist-discord-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Get Discord message ID
        id: message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="$(gh variable get DISCORD_MESSAGE_ID --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)"

          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Update Discord embed
        id: update
        env:
          ANILIST_USERNAME: ${{ vars.ANILIST_USERNAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ steps.message.outputs.id }}
        run: |
          python update.py | tee update.log

          ID="$(grep '^DISCORD_MESSAGE_ID=' update.log | tail -1 | cut -d= -f2)"

          if [ -z "$ID" ]; then
            echo "Could not determine Discord message ID."
            exit 1
          fi

          echo "message_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Save Discord message ID
        if: steps.message.outputs.id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh variable set DISCORD_MESSAGE_ID \
            --repo "$GITHUB_REPOSITORY" \
            --body "${{ steps.update.outputs.message_id }}"
