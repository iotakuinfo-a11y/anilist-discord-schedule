
name: Update AniList Discord Embed

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: anilist-discord-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore Discord message IDs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import zipfile
          import io

          repository = os.environ["GH_REPOSITORY"]
          current_run = int(os.environ["GH_RUN_ID"])
          token = os.environ["GH_TOKEN"]

          api = f"https://api.github.com/repos/{repository}/actions/artifacts?per_page=100"

          request = urllib.request.Request(
              api,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          try:
              with urllib.request.urlopen(request) as response:
                  data = json.load(response)
          except Exception as error:
              print(f"Could not list artifacts: {error}")
              raise

          artifacts = [
              artifact for artifact in data.get("artifacts", [])
              if artifact.get("name") == "discord-message-ids"
              and not artifact.get("expired")
              and artifact.get("workflow_run", {}).get("id") != current_run
          ]

          artifacts.sort(
              key=lambda artifact: artifact.get("created_at", ""),
              reverse=True,
          )

          if not artifacts:
              print("No previous message-ID artifact found; starting fresh.")
              raise SystemExit(0)

          artifact_id = artifacts[0]["id"]
          print(f"Restoring message IDs from artifact {artifact_id}")

          download_url = (
              f"https://api.github.com/repos/{repository}"
              f"/actions/artifacts/{artifact_id}/zip"
          )

          request = urllib.request.Request(
              download_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              },
          )

          with urllib.request.urlopen(request) as response:
              archive_bytes = response.read()

          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              candidates = [
                  name for name in archive.namelist()
                  if name.endswith("discord_message_ids.json")
              ]

              if not candidates:
                  print("Artifact contained no message-ID file; starting fresh.")
                  raise SystemExit(0)

              content = archive.read(candidates[0])
              json.loads(content)

              with open("discord_message_ids.json", "wb") as output:
                  output.write(content)

          print("Message IDs restored.")
          PY

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run update.py
        env:
          ANILIST_USERNAME: ${{ vars.ANILIST_USERNAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISPLAY_TIMEZONE: Pacific/Honolulu
        run: |
          echo "Started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python -u update.py
          echo "Finished at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Save Discord message IDs
        if: success() && hashFiles('discord_message_ids.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: discord-message-ids
          path: discord_message_ids.json
          retention-days: 90
          overwrite: true
